name: sheknows
description: "sheknows — a menstrual cycle and symptom tracker."
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  connectivity_plus: ^6.1.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  go_router: ^15.1.2
  hive_ce_flutter: ^2.3.1
  supabase_flutter: ^2.9.1
  google_fonts: ^8.2.1
  intl: any
  purchases_flutter: ^10.10.1
  purchases_ui_flutter: ^10.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#16142B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# Regenerate with: dart run flutter_native_splash:create
# Kills the white launch flash before the dark-first app appears.
flutter_native_splash:
  color: "#16142B"
  color_dark: "#16142B"
  image: "assets/icon/icon_foreground.png"
  image_dark: "assets/icon/icon_foreground.png"
  android_12:
    color: "#16142B"
    color_dark: "#16142B"
    image: "assets/icon/icon_foreground.png"
    image_dark: "assets/icon/icon_foreground.png"
    icon_background_color: "#16142B"
    icon_background_color_dark: "#16142B"

